name: Browser compatibility (manual)

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Additional browser to verify (failures are not suppressed)
        type: choice
        options: [webkit, firefox]
        required: true
        default: webkit

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXTRA_BROWSER: ${{ inputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium "$EXTRA_BROWSER"
      - run: bun run agent:doctor
      - run: bun run check
      - run: bun run test:e2e:all --project="$EXTRA_BROWSER"
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ inputs.browser }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
